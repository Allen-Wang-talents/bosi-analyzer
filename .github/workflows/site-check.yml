name: 站点可用性检查

# 从 GitHub 的 runner 上访问线上站点 —— 有些公司网络解不开 *.vercel.app,
# 在本机测不出来, 这里测得到。
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 首页
        run: |
          code=$(curl -s -o /tmp/home -w '%{http_code}' --max-time 25 https://bosi-analyzer.vercel.app/)
          echo "首页 -> HTTP $code"
          grep -o '<title>[^<]*</title>' /tmp/home || echo "(没取到标题)"
          [ "$code" = "200" ] || { echo "::error::首页打不开"; exit 1; }

      - name: 健康检查接口
        run: |
          code=$(curl -s -o /tmp/health -w '%{http_code}' --max-time 25 https://bosi-analyzer.vercel.app/api/health)
          echo "health -> HTTP $code"; cat /tmp/health; echo
          [ "$code" = "200" ] || { echo "::error::health 不通"; exit 1; }

      - name: 岗位池接口 (必须是 JSON, 不能被 SPA 兜底换成 HTML)
        run: |
          code=$(curl -s -o /tmp/jobs -w '%{http_code}' --max-time 30 https://bosi-analyzer.vercel.app/api/jobs)
          echo "jobs -> HTTP $code"; head -c 300 /tmp/jobs; echo
          [ "$code" = "200" ] || { echo "::error::jobs 不通"; exit 1; }
          head -c 1 /tmp/jobs | grep -q '{' || {
            echo "::error::/api/jobs 返回的不是 JSON —— vercel.json 的 /(.*) → /index.html 兜底把 API 盖住了"
            exit 1
          }

      - name: 诊断端点 (临时)
        run: |
          code=$(curl -s -o /tmp/diag -w '%{http_code}' --max-time 60 https://bosi-analyzer.vercel.app/api/diag)
          echo "diag -> HTTP $code"; cat /tmp/diag; echo
